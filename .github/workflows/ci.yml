name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # BOM 是纯 pom：校验 XML 结构、坐标合法、dependencyManagement 可解析
      - name: Validate BOM
        run: mvn -B -ntp validate

      # 版本变更时校验对应版本已发布到 Central，防止 BOM 指向不存在的版本
      - name: Check managed versions exist on Maven Central
        run: |
          fail=0
          while IFS='=' read -r name version; do
            case "$name" in
              auth-kit.version|api-governance.version|guard.version|web-common.version|state-kit.version|outboxpro.version) ;;
              *) continue ;;
            esac
            case "$name" in
              auth-kit.version) artifact=auth-kit-spring-boot-starter ;;
              api-governance.version) artifact=api-governance-spring-boot-starter ;;
              guard.version) artifact=guard-spring-boot-starter ;;
              web-common.version) artifact=web-common-spring-boot-starter ;;
              state-kit.version) artifact=state-kit-spring-boot-starter ;;
              outboxpro.version) artifact=outboxpro-spring-boot-starter ;;
            esac
            url="https://repo1.maven.org/maven2/io/github/biglv666/${artifact}/${version}/${artifact}-${version}.pom"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error::${artifact}:${version} 不在 Maven Central 上（HTTP $code）: $url"
              fail=1
            else
              echo "OK: ${artifact}:${version}"
            fi
          done < <(sed -n 's/^\s*<\(\(auth-kit\|api-governance\|guard\|web-common\|state-kit\|outboxpro\)\.version\)>\(.*\)<\/\1>/\1=\3/p' pom.xml)
          exit $fail
